<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Keep the composer above the keyboard without disabling pinch zoom. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="" />
  <meta name="description" content="Aivory — a thoughtful AI companion for writing, reasoning, and exploration." />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Aivory" />
  <meta name="application-name" content="Aivory" />
  <title>Aivory</title>

  <style data-aivory-startup>/* aivory:startup-styles */</style>
  <script data-aivory-startup>/* aivory:startup-script */</script>
</head>

<body class="h-full">
  <div id="root" class="h-full">
    <div class="aivory-startup" data-startup-screen="static" data-state="loading" role="status"
      aria-live="polite" aria-atomic="true" aria-busy="true" aria-label="Aivory">
      <div class="aivory-startup-brand" aria-hidden="true">
        <svg class="aivory-startup-mark" viewBox="0 0 32 32" focusable="false">
          <path
            d="M16 4.5c-1.05 0-2.01.61-2.45 1.56L4.78 24.5c-.7 1.5.4 3.2 2.05 3.2h18.34c1.65 0 2.75-1.7 2.05-3.2L18.45 6.06A2.7 2.7 0 0 0 16 4.5Zm0 4.55 7.15 15.15H8.85L16 9.05Z"
            fill-rule="evenodd" />
          <circle cx="16" cy="20.9" r="1.4" />
        </svg>
        <span class="aivory-startup-wordmark"></span>
      </div>
      <div class="aivory-startup-status">
        <div class="aivory-startup-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="aivory-startup-message"></p>
        <button type="button" class="aivory-startup-reload" hidden></button>
      </div>
    </div>
  </div>
  <noscript>
    <style>[data-startup-screen='static'] { display: none; }</style>
    <div class="aivory-startup aivory-noscript" role="alert">
      <strong>Aivory</strong>
      <!-- aivory:noscript -->
    </div>
  </noscript>
  <script>window.aivoryStartup.mount()</script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
